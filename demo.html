<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">多语言演示网站</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-color: #222;
            --card-bg: #ffffff;
            --nav-bg: #2563eb;
            --card-shadow: 0 2px 12px #00000010;
        }
        /* 深色主题变量 */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8e8e8;
            --card-bg: #1e1e1e;
            --nav-bg: #1d4ed8;
            --card-shadow: 0 2px 12px #00000040;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            min-height:100vh;
        }
        /* =========页面入场滑动淡入动画（和主页一模一样）========= */
        .wrap-content{
            opacity:0;
            transform: translateY(16px);
            animation: pageFadeIn 0.45s ease forwards;
        }
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }
        /* 导航栏 */
        header {
            background: var(--nav-bg);
            color: white;
            padding: 0 16px;
            transition: background 0.3s ease;
        }
        .nav-wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            min-height: 64px;
            gap: 10px;
            padding: 10px 0;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 15px;
            display: inline-block;
            padding: 4px 0;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .lang-select, .theme-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        /* 主体内容：全部文字水平居中 */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px;
            text-align:center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: clamp(24px,5vw,32px);
        }
        p {
            font-size: 17px;
            line-height: 1.7;
            max-width: 700px;
            opacity: 0.88;
            margin:0 auto;
        }
        .info-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-top: 30px;
            transition: background 0.3s ease;
            max-width:700px;
            margin-left:auto;
            margin-right:auto;
            text-align:center;
        }
        footer {
            text-align: center;
            padding: 30px;
        }
        /* 手机端适配规则 */
        @media (max-width: 768px) {
            .nav-wrap {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-menu {
                margin: 8px 0;
            }
            .nav-menu a {
                margin: 0 6px;
                font-size: 14px;
            }
            main{
                padding:20px 16px;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="nav-wrap">
        <div class="logo" data-i18n="logoName">我的网站</div>
        <nav class="nav-menu">
            <a href="index.html">首页</a>
            <a href="index.html#works">我的作品</a>
        </nav>
        <div class="toolbar">
            <select class="lang-select" id="languageSelect">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="ru">Русский</option>
            </select>
            <button class="theme-btn" id="themeToggle">🌓</button>
        </div>
    </div>
</header>
<!-- 给主体内容套一层，实现滑动淡入动画 -->
<div class="wrap-content">
    <main>
        <h1 data-i18n="mainTitle">欢迎来到本站</h1>
        <p data-i18n="mainDesc">这是一个支持多国语言切换的示例网站，你可以在右上角选择语言。页面带有导航栏，没有轮播图，布局简洁清爽。</p>
        <div class="info-box">
            <h3 data-i18n="boxTitle">网站介绍</h3>
            <p data-i18n="boxText">你可以自由修改文字、颜色、页面内容。后续如果想要增加更多功能，比如留言板、图片展示都可以继续扩展。</p>
        </div>
    </main>
    <footer>
    </footer>
</div>

<script>
// ========== 主题切换逻辑 ==========
const html = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('siteTheme');
if (savedTheme) {
    html.setAttribute('data-theme', savedTheme);
} else {
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('siteTheme', 'dark');
    }
}
themeBtn.addEventListener('click', () => {
    const now = html.getAttribute('data-theme');
    if (now === 'dark') {
        html.removeAttribute('data-theme');
        localStorage.setItem('siteTheme', 'light');
    } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('siteTheme', 'dark');
    }
});

    "es": {

        navContact: "Contacto",

        mainDesc: "Este es un sitio de demostración multilingüe. Puede cambiar el idioma en la esquina superior derecha. Cuenta con barra de navegación sin carrusel y diseño sencillo.",
        boxTitle: "Información del sitio",
        boxText: "Puede modificar libremente textos, colores y contenido. Más adelante puede añadir funciones como tablero de mensajes o galería de imágenes."
    },
    "ru": {

        navContact: "Контакты",

        mainDesc: "Это многоязычный демонстрационный сайт. Язык можно выбрать в правом верхнем углу. Есть панель навигации, без карусели, простой макет.",
        boxTitle: "Описание сайта",
        boxText: "Вы можете свободно изменять текст, цвета и содержание страницы. Позже можно добавить гостевую книгу, галерею изображений и другие функции."

// 支持的语言列表
const supportedLangs = ["zh-CN","zh-TW","en","ja","ko","fr","de","es","ru"];
const select = document.getElementById('languageSelect');
// 更新页面语言
function setLanguage(lang) {
    if (!supportedLangs.includes(lang)) lang = "zh-CN";
    document.documentElement.lang = lang;
    select.value = lang;
    const data = i18nData[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = data[key];
    });
}
// 获取浏览器系统语言
function getBrowserLang() {
    const raw = navigator.language || navigator.userLanguage;
    if (supportedLangs.includes(raw)) return raw;
    // 简体中文兼容 zh
    if(raw.startsWith("zh")) return "zh-CN";
    return "en";
}
// 初始化语言逻辑
let initLang;
const savedLang = localStorage.getItem('siteLang');
if(savedLang && supportedLangs.includes(savedLang)){
    initLang = savedLang;
}else{
    initLang = getBrowserLang();
}
setLanguage(initLang);
// 手动切换语言时保存记录
select.addEventListener('change', () => {
    const chosen = select.value;
    localStorage.setItem('siteLang', chosen);
    setLanguage(chosen);
});
</script>
</body>
</html>
