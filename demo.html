<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">多语言演示网站</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-color: #222;
            --card-bg: #ffffff;
            --nav-bg: #2563eb;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8e8e8;
            --card-bg: #1e1e1e;
            --nav-bg: #1d4ed8;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            min-height:100vh;
        }
        .wrap-content{
            opacity:0;
            transform: translateY(16px);
            animation: pageFadeIn 0.45s ease forwards;
        }
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }
        header {
            background: var(--nav-bg);
            color: white;
            padding: 0 16px;
            transition: background 0.3s ease;
        }
        .nav-wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            min-height: 64px;
            gap: 10px;
            padding: 10px 0;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 15px;
            display: inline-block;
            padding: 4px 0;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .lang-select, .theme-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px;
            text-align:center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: clamp(24px,5vw,32px);
        }
        p {
            font-size: 17px;
            line-height: 1.7;
            max-width: 700px;
            opacity: 0.88;
            margin:0 auto;
        }
        .info-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-top: 30px;
            transition: background 0.3s ease;
            max-width:700px;
            margin-left:auto;
            margin-right:auto;
            text-align:center;
        }
        .info-box h3 {
            margin-bottom:12px;
        }
        footer {
            text-align: center;
            padding: 30px;
        }
        @media (max-width: 768px) {
            .nav-wrap {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-menu {
                margin: 8px 0;
            }
            .nav-menu a {
                margin: 0 6px;
                font-size: 14px;
            }
            main{
                padding:20px 16px;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="nav-wrap">
        <div class="logo" data-i18n="logoName">我的网站</div>
        <nav class="nav-menu">
            <!-- 重点：增加data-i18n绑定翻译 -->
            <a href="index.html" data-i18n="nav.home">首页</a>
            <a href="index.html#works" data-i18n="nav.works">我的作品</a>
        </nav>
        <div class="toolbar">
            <select class="lang-select" id="languageSelect">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="ru">Русский</option>
            </select>
            <button class="theme-btn" id="themeToggle">🌓</button>
        </div>
    </div>
</header>
<div class="wrap-content">
    <main>
        <h1 data-i18n="mainTitle">欢迎来到本站</h1>
        <p data-i18n="mainDesc">这是一个支持多国语言切换的示例网站，你可以在右上角选择语言。页面带有导航栏，没有轮播图，布局简洁清爽。</p>
        <div class="info-box">
            <h3 data-i18n="boxTitle">网站介绍</h3>
            <p data-i18n="boxText">你可以自由修改文字、颜色、页面内容。后续如果想要增加更多功能，比如留言板、图片展示都可以继续扩展。</p>
        </div>
    </main>
    <footer></footer>
</div>

        },

// 翻译渲染函数
function applyLanguage(langKey) {
    const langPack = i18nData[langKey] || i18nData["zh-CN"];
    document.documentElement.lang = langKey;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        // 支持多级key，例如 nav.home
        const keys = key.split('.');
        let text = langPack;
        for(const k of keys) text = text[k];
        if(text) el.textContent = text;
    });
}

// ========== 主题切换 ==========
const html = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('siteTheme');
if (savedTheme) {
    html.setAttribute('data-theme', savedTheme);
}
themeBtn.addEventListener('click', () => {
    const now = html.getAttribute('data-theme');
    if(now === 'dark'){
        html.removeAttribute('data-theme');
        localStorage.setItem('siteTheme','light');
    }else{
        html.setAttribute('data-theme','dark');
        localStorage.setItem('siteTheme','dark');
    }
});

// ========== 语言切换逻辑 ==========
const langSelect = document.getElementById('languageSelect');
const savedLang = localStorage.getItem('siteLang') || "zh-CN";
langSelect.value = savedLang;
applyLanguage(savedLang);

langSelect.addEventListener('change', function(){
    const selected = this.value;
    localStorage.setItem('siteLang', selected);
    applyLanguage(selected);
});
</script>
</body>
</html>
