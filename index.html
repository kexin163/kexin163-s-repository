<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">个人博客主页</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-color: #222;
            --card-bg: #ffffff;
            --nav-bg: #2563eb;
            --card-shadow: 0 2px 12px #00000010;
            --hover-shadow: 0 4px 18px #00000018;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8e8e8;
            --card-bg: #1e1e1e;
            --nav-bg: #1d4ed8;
            --card-shadow: 0 2px 12px #00000040;
            --hover-shadow: 0 4px 18px #00000050;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }
        header {
            background: var(--nav-bg);
            color: white;
            padding: 0 16px;
            transition: background 0.3s ease;
        }
        .nav-wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            min-height: 64px;
            gap: 10px;
            padding: 10px 0;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-size: 15px;
            display: inline-block;
            padding: 4px 0;
            cursor: pointer;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .lang-select, .theme-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        /* 主体容器 */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 16px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        h1 {
            margin-bottom: 20px;
            font-size: clamp(24px,5vw,32px);
        }
        .intro-text {
            font-size: 17px;
            line-height: 1.8;
            max-width: 750px;
            opacity: 0.9;
        }
        /* 作品卡片网格 */
        .works-grid {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }
        .work-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }
        .work-card h3 {
            margin-bottom: 10px;
        }
        .work-card p {
            opacity: 0.85;
            line-height: 1.6;
            font-size: 15px;
        }
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 80px;
            opacity: 0.7;
            font-size:14px;
        }
        /* 移动端适配 */
        @media (max-width: 768px) {
            .nav-wrap {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-menu {
                margin: 8px 0;
            }
            .works-grid {
                grid-template-columns: 1fr;
            }
        }
        /* 语言选择器默认隐藏，仅作品页面显示 */
        .lang-box {
            display: none;
        }
        .works-page-active .lang-box {
            display: block;
        }
    </style>
</head>
<body>
<header>
    <div class="nav-wrap">
        <div class="logo" data-i18n="blogName">我的个人主页</div>
        <nav class="nav-menu">
            <a onclick="switchPage('home')" data-i18n="navHome">首页</a>
            <a onclick="switchPage('works')" data-i18n="navWorks">我的作品</a>
        </nav>
        <div class="toolbar">
            <div class="lang-box">
                <select class="lang-select" id="languageSelect">
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                </select>
            </div>
            <button class="theme-btn" id="themeToggle">🌓</button>
        </div>
    </div>
</header>

<main>
    <!-- 首页 -->
    <div id="page-home" class="page active">
        <h1 data-i18n="homeTitle">欢迎来到我的主页</h1>
        <p class="intro-text" data-i18n="homeIntro">
            你可以在这里填写个人简介。比如：喜欢制作网页、热爱创作，持续分享自己开发的各类小项目。
            前往【我的作品】页面查看所有项目。点击卡片即可打开对应的作品网站。
        </p>
    </div>

    <!-- 我的作品页面 -->
    <div id="page-works" class="page">
        <h1 data-i18n="worksTitle">我的作品</h1>
        <div class="works-grid">
            <!-- 作品卡片 示例，你可以复制这段新增更多作品 -->
            <div class="work-card" onclick="openWork('demo.html')">
                <h3 data-i18n="work1Name">多语言演示网站</h3>
                <p data-i18n="work1Desc">支持浅色深色切换、多国语言，自动记忆用户偏好的静态网页。</p>
            </div>
            <!-- 新增作品模板，复制下面整块即可
            <div class="work-card" onclick="openWork('你的网页文件名.html')">
                <h3>作品名称</h3>
                <p>作品简介</p>
            </div>
            -->
        </div>
    </div>
</main>

<footer>
    <span data-i18n="copyright">© 2026 个人主页</span>
</footer>

<script>
// ========== 主题切换逻辑 ==========
const html = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('siteTheme');

if (savedTheme) {
    html.setAttribute('data-theme', savedTheme);
} else {
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('siteTheme', 'dark');
    }
}

themeBtn.addEventListener('click', () => {
    const now = html.getAttribute('data-theme');
    if (now === 'dark') {
        html.removeAttribute('data-theme');
        localStorage.setItem('siteTheme', 'light');
    } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('siteTheme', 'dark');
    }
});

// ========== 页面切换 ==========
function switchPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageName).classList.add('active');
    // 控制语言选择器显示（仅作品页面显示）
    if(pageName === 'works'){
        document.querySelector('.nav-wrap').classList.add('works-page-active');
    }else{
        document.querySelector('.nav-wrap').classList.remove('works-page-active');
    }
}
// 打开作品链接
function openWork(url) {
    window.open(url, '_blank');
}

// 支持语言列表
const supportedLangs = ["zh-CN","zh-TW","en","ja","ko","fr","de","es","ru"];
const select = document.getElementById('languageSelect');

function setLanguage(lang) {
    if (!supportedLangs.includes(lang)) lang = "zh-CN";
    document.documentElement.lang = lang;
    select.value = lang;
    const data = i18nData[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = data[key];
    });
}

// 获取浏览器系统语言
function getBrowserLang() {
    const raw = navigator.language || navigator.userLanguage;
    if (supportedLangs.includes(raw)) return raw;
    if(raw.startsWith("zh")) return "zh-CN";
    return "en";
}

// 初始化语言
let initLang;
const savedLang = localStorage.getItem('siteLang');
if(savedLang && supportedLangs.includes(savedLang)){
    initLang = savedLang;
}else{
    initLang = getBrowserLang();
}
setLanguage(initLang);

select.addEventListener('change', () => {
    const chosen = select.value;
    localStorage.setItem('siteLang', chosen);
    setLanguage(chosen);
});
</script>

</html>
